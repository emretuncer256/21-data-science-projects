<svg width="560" height="200" viewBox="0 0 560 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Article Recommendation System — NLP">
  <defs>
    <linearGradient id="grad14" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6a11cb;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#2575fc;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#2AF598;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow14" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.25)"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="560" height="200" rx="16" fill="url(#grad14)" filter="url(#shadow14)"/>
  <g fill="#ffffff">
    <text x="24" y="48" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="22" font-weight="600">14. Article Recommendation System — NLP</text>
    <text x="24" y="84" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" opacity="0.95">Recommend related articles by matching textual semantics with TF‑IDF.</text>
    <text x="24" y="104" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" opacity="0.95">Input a title or content; retrieve top‑N most similar articles instantly.</text>
    <text x="24" y="136" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" opacity="0.95">Topics: NLP, TF‑IDF, Cosine Similarity, Content‑based Recommender</text>
  </g>
</svg>
