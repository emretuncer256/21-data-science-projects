<svg width="560" height="200" viewBox="0 0 560 200" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Hotel Recommendation System — Recommendation Systems">
  <defs>
    <linearGradient id="grad18" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1"/>
      <stop offset="50%" style="stop-color:#764ba2;stop-opacity:1"/>
      <stop offset="100%" style="stop-color:#f093fb;stop-opacity:1"/>
    </linearGradient>
    <filter id="shadow18" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="rgba(0,0,0,0.25)"/>
    </filter>
  </defs>
  <rect x="0" y="0" width="560" height="200" rx="16" fill="url(#grad18)" filter="url(#shadow18)"/>
  <g fill="#ffffff">
    <text x="24" y="48" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="18" font-weight="600">18. Hotel Recommendation System — Recommendation Systems</text>
    <text x="24" y="84" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" opacity="0.95">Personalized hotel suggestions using TF-IDF vectorization and cosine</text>
    <text x="24" y="104" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="14" opacity="0.95">similarity on hotel tags and user preferences with NLP preprocessing.</text>
    <text x="24" y="136" font-family="Inter,Segoe UI,Roboto,Helvetica,Arial,sans-serif" font-size="13" opacity="0.95">Topics: Recommender Systems, TF-IDF, Cosine Similarity, NLP, Streamlit</text>
  </g>
</svg>
